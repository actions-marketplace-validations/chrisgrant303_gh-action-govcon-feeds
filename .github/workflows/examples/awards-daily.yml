# Example: copy to .github/workflows/ in your repo. Needs the repository secret APIFY_TOKEN.
# Runs bill to your own Apify account under the Actor's pay-per-event pricing: https://apify.com/cce_partners/federal-contract-award-winners-feed
name: "VA IT contract awards (daily)"
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
concurrency:
  group: va-it-awards
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: feed
        uses: chrisgrant303/gh-action-govcon-feeds@v1
        with:
          apify-token: ${{ secrets.APIFY_TOKEN }}
          actor: awards
          monitor-name: va-it-awards
          input-json: >-
            {"naicsCodes":["541512","541519"],"awardingAgencies":["Department of Veterans Affairs"],"minAwardAmount":250000,"lookbackDays":14,"includeDodDelayed":true}
          max-items: '500'
          timeout-secs: '900'
          output-format: both
          open-issue: 'true'
          github-token: ${{ github.token }}
          # issue-labels: awards   # labels must already exist in your repo
      - uses: actions/upload-artifact@v4
        if: always() && steps.feed.outputs.item-count != '' && steps.feed.outputs.item-count != '0'
        with:
          name: awards-${{ steps.feed.outputs.run-id }}
          path: apify-output/
          retention-days: 30
