# Example: copy to .github/workflows/ in your repo. Needs the repository secret APIFY_TOKEN.
# Runs bill to your own Apify account under the Actor's pay-per-event pricing: https://apify.com/cce_partners/samgov-opportunity-radar
name: "SAM.gov IT opportunities (daily)"
on:
  schedule:
    - cron: '15 11 * * 1-5'
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
concurrency:
  group: it-8a-daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: feed
        uses: chrisgrant303/gh-action-govcon-feeds@v1
        with:
          apify-token: ${{ secrets.APIFY_TOKEN }}
          actor: sam
          monitor-name: it-8a-daily
          input-json: >-
            {"naicsCodes":["541512","541519"],"setAside":"8A","noticeTypes":["o","p","k","r"],"lookbackDays":7,"includeDetails":true}
          max-items: '200'
          timeout-secs: '900'
          output-format: both
          open-issue: 'true'
          github-token: ${{ github.token }}
          # issue-labels: sam-gov,opportunities   # labels must already exist in your repo
      - uses: actions/upload-artifact@v4
        if: always() && steps.feed.outputs.item-count != '' && steps.feed.outputs.item-count != '0'
        with:
          name: sam-${{ steps.feed.outputs.run-id }}
          path: apify-output/
          retention-days: 30
