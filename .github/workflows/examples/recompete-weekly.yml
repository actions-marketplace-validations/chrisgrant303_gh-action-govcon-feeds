# Example: copy to .github/workflows/ in your repo. Needs the repository secret APIFY_TOKEN.
# Runs bill to your own Apify account under the Actor's pay-per-event pricing: https://apify.com/cce_partners/govcon-recompete-radar
name: "VA IT recompetes (weekly)"
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
concurrency:
  group: va-it-recompetes
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: feed
        uses: chrisgrant303/gh-action-govcon-feeds@v1
        with:
          apify-token: ${{ secrets.APIFY_TOKEN }}
          actor: recompete
          monitor-name: va-it-recompetes
          # The SAM.gov match (joinSam, on by default) works without a key, using the public nightly extract.
          # For real-time matching, add "samApiKey":"${{ secrets.SAM_API_KEY }}" to input-json (it is masked).
          input-json: >-
            {"naicsCodes":["541512"],"awardingAgencies":["Department of Veterans Affairs"],"minAwardAmount":1000000,"monthsFrom":3,"monthsTo":18}
          max-items: '100'
          timeout-secs: '900'
          output-format: both
          open-issue: 'true'
          github-token: ${{ github.token }}
          # issue-labels: recompete   # labels must already exist in your repo
      - uses: actions/upload-artifact@v4
        if: always() && steps.feed.outputs.item-count != '' && steps.feed.outputs.item-count != '0'
        with:
          name: recompete-${{ steps.feed.outputs.run-id }}
          path: apify-output/
          retention-days: 30
